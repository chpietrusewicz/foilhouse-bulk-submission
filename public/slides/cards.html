<fieldset class="cards-fieldset">
  <legend>Card entries</legend>
  <div id="card-entries" class="card-entries">
    <div class="card-entry" data-entry-index="0">
      <label>Number of cards<input class="card-count" type="number" min="1" required /></label>
      <label>Type
        <select class="card-type" required>
          <option value="" selected disabled>Choose a type</option>
          <option>Common / uncommon</option>
          <option>Holo / reverse holo</option>
          <option>EX / V / GX</option>
        </select>
      </label>
      <label class="photo-picker" title="Add card photos">
        <span class="photo-plus" aria-hidden="true">+</span>
        <span>Add photos</span>
        <input class="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple />
      </label>
      <div class="photo-previews" aria-live="polite"></div>
    </div>
  </div>
  <button class="btn add-entry" id="add-card-entry" type="button">+ Add card type</button>
  <p class="muted card-photo-note">Add at least one photo. You can add up to 10 photos total.</p>
</fieldset>
