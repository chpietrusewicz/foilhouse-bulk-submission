<fieldset>
  <legend>Your cards</legend>
  <div class="row">
    <label>Approx. number of cards<input name="count" type="number" min="1" required /></label>
    <label>Estimated weight <small>lbs, roughly</small><input name="weight" required /></label>
  </div>
  <div>
    What's in the lot?
    <div class="checks">
      <label class="chk"><input type="checkbox" name="kind" value="Bulk/commons" /> Bulk / commons</label>
      <label class="chk"><input type="checkbox" name="kind" value="Holos/rares" /> Holos / rares</label>
      <label class="chk"><input type="checkbox" name="kind" value="Sealed product" /> Sealed product</label>
      <label class="chk"><input type="checkbox" name="kind" value="Graded cards" /> Graded cards</label>
    </div>
  </div>
</fieldset>
