<fieldset>
  <legend>Ship-from address</legend>
  <label>Street address<input name="street" required autocomplete="address-line1" /></label>
  <div class="row">
    <label>City<input name="city" required autocomplete="address-level2" /></label>
    <label>State<input name="state" required maxlength="2" autocomplete="address-level1" /></label>
    <label>ZIP<input name="zip" required inputmode="numeric" autocomplete="postal-code" /></label>
  </div>
</fieldset>
